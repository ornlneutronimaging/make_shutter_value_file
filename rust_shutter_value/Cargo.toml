[package]
name = "shutter_value_maker"
version = "0.1.0"
edition = "2024"
description = "Interactive GUI to create MCP ShutterValues files (Rust port of the step1/step2/step3 Python scripts)"

[dependencies]
anyhow = "1.0"
eframe = "0.34"
egui = "0.34"
egui_plot = "0.35"
# gtk3 backend (not the default xdg-portal one): the portal ignores
# set_directory, so dialogs would not open in the selected IPTS folder.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[profile.release]
opt-level = 2
